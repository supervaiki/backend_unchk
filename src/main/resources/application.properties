spring.application.name=backend_unchk

# =========================
# DATABASE CONFIGURATION
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/unchk_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration du Pool de Connexion HikariCP
spring.datasource.hikari.max-lifetime=250000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gestion du dialecte pour resoudre l avertissement de version 5.5.5
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# =========================
# SERVER
# =========================
server.port=8080

# =========================
# JWT CONFIGURATION
# =========================
jwt.secret=VW5lQ2xlZlNlY3JldGVUcmVzTG9uZ3VlUG91ckxlUHJvamV0TWFzdGVySW5nZW5pZXJpZUxvZ2ljaWVsbGVVRkMyMDI2VW5ja01S
jwt.expiration=86400000

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# =========================
# LOGGING, UPLOAD AND MAIL
# =========================
logging.level.root=INFO
logging.level.com.example.backend_unchk=DEBUG
file.upload.dir=uploads
file.max.size=10485760
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true